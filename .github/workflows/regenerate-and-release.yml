# Generated by eidos: dynamic regenerate-and-release workflow.
#
# Regenerates this provider from its OpenAPI spec and publishes a release in a
# single manually-dispatched run, using the eidos CI image (eidos + Go +
# GoReleaser). This complements the generated release.yml, which builds
# committed code on a v* tag push; the two coexist with non-overlapping
# triggers (workflow_dispatch here vs. tag push there). Trigger via Actions →
# "Regenerate and Release" → Run workflow, entering a version like v1.2.3.
#
# The regenerated provider code is committed to a release-specific branch
# (release/<version>), not the default branch, so the default branch keeps only
# the spec and the committed build scaffolding. Because the tag is created with
# the default GITHUB_TOKEN, it does not re-trigger release.yml (GITHUB_TOKEN
# events do not start new workflow runs). Adjust the image and spec path via
# generation.dynamic_release in generator.yaml. Signed checksums are default-on;
# configure GPG_PRIVATE_KEY and GPG_PASSPHRASE repository secrets, or opt out
# with sign_release: false in generator.yaml.

name: Regenerate and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Regenerate and release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/signalbreak-labs/eidos:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate provider from spec
        # --skip-build keeps the committed build scaffolding; only the provider
        # code is regenerated into the working tree.
        run: eidos generate --config generator.yaml --skip-build --output . --force

      - name: Build and test
        run: |
          go mod tidy
          go build -buildvcs=false ./...
          go test -buildvcs=false ./...

      - name: Commit, tag, and push to a release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "release/${VERSION}"
          git add -A
          git commit -m "chore: regenerate provider from spec for ${VERSION}"
          git tag "${VERSION}"
          git push origin "release/${VERSION}"
          git push origin "${VERSION}"


      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
