# Dynamic regenerate-and-release workflow.
#
# Runs inside the eidos container (eidos + Go + golangci-lint + goreleaser).
# Regenerates the provider from its OpenAPI spec and publishes a release
# without committing generated provider code to the default branch. The
# generated code is committed locally, tagged, and then built into release
# archives by GoReleaser. Only the tag is pushed to the remote; the tag commit
# is not on any branch, so the default branch stays clean.
#
# Trigger via Actions → "Regenerate and Release" → Run workflow, entering a
# version like v1.2.3.

name: Regenerate and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Regenerate and release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/signalbreak-labs/eidos:latest
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Regenerate provider from spec
        run: eidos generate --config generator.yaml --skip-build --output . --force

      - name: Build and test
        run: |
          go mod tidy
          go build -buildvcs=false ./...
          go test -buildvcs=false ./...

      - name: Commit generated code and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate provider from spec for ${VERSION}"
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
