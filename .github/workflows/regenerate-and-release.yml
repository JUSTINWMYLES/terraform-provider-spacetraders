# Generated by eidos: dynamic regenerate-and-release workflow.
#
# Regenerates this provider from its OpenAPI spec and publishes a release in a
# single manually-dispatched run. Trigger via Actions → "Regenerate and Release"
# → Run workflow, entering a version like v1.2.3.
#
# The regenerated provider code is committed to a release-specific branch
# (release/<version>), not the default branch, so the default branch keeps only
# the spec and the committed build scaffolding. Because the tag is created with
# the default GITHUB_TOKEN, it does not re-trigger release.yml.

name: Regenerate and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Regenerate and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install eidos
        run: brew install signalbreak-labs/tap/eidos

      - name: Regenerate provider from spec
        run: eidos generate --config generator.yaml --skip-build --output . --force

      - name: Build and test
        run: |
          go mod tidy
          go build -buildvcs=false ./...
          go test -buildvcs=false ./...

      - name: Commit, tag, and push to a release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "release/${VERSION}"
          git add -A
          git commit -m "chore: regenerate provider from spec for ${VERSION}"
          git tag "${VERSION}"
          git push origin "release/${VERSION}"
          git push origin "${VERSION}"

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
