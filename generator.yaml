    - operation: get-ship-cooldown
      datasource_name: get_ship_cooldown
    - operation: get-ship-modules
      datasource_name: get_ship_modules
    - operation: get-mounts
      datasource_name: get_mounts
    - operation: get-ship-nav
      datasource_name: get_ship_nav
    - operation: get-repair-ship
      datasource_name: get_repair_ship
    - operation: get-scrap-ship
      datasource_name: get_scrap_ship
    - operation: websocket-departure-events
      datasource_name: websocket_departure_events
    - operation: get-systems
      datasource_name: get_systems
    - operation: get-system
      datasource_name: get_system
    - operation: get-system-waypoints
      datasource_name: get_system_waypoints
    - operation: get-waypoint
      datasource_name: get_waypoint
    - operation: get-construction
      datasource_name: get_construction
    - operation: get-jump-gate
