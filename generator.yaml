logging:
    max_body_bytes: 4096
    redact_headers:
        - Authorization
        - X-API-Key
        - Cookie
auth:
    - scheme: bearer
      env_var: SPACETRADERS_ACCOUNTTOKEN
    - scheme: bearer
      env_var: SPACETRADERS_AGENTTOKEN
global_timeouts:
    create: 20m
    read: 10m
    update: 20m
    delete: 10m
generate_terraform_tests: false
sign_release: true
generation:
    dynamic_release:
        enabled: true
        spec_path: https://api.spacetraders.io/v2/documentation/json
spec:
    path: https://api.spacetraders.io/v2/documentation/json
    format: openapi3
